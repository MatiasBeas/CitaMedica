spring.application.name=cita-medica
server.port=8183

spring.datasource.url=jdbc:mysql://localhost:3306/hp_citaMedica
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

staff-service.url=http://localhost:8182/api/staff
paciente-service.url=http://localhost:8082/pacientes
bono-service.url=http://localhost:8185/api/bono

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.model-converters.deprecate-on-partial-match=true

springdoc.api-docs.path=/v3/api-docs/Cita_medica

